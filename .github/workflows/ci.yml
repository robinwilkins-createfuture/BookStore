name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build BookStore.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/BookStore.Api.Tests/BookStore.Api.Tests.csproj --no-build --configuration Release --verbosity normal
